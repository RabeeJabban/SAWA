<!DOCTYPE html>
<html lang="de" dir="ltr">

  <link rel="manifest" href="manifest.webmanifest">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="description" content="Orbyx – organize your chaos">
<link rel="stylesheet" href="ui.css?v=20">

<style>
/* ===================================================================
   ORBYX · FARBEN
   Die Palette kommt aus dem Symbol: Grün, Rot, Orange, Blau auf Tinte.
   Dieselben Farben stehen den Kreisen zur Auswahl.
   =================================================================== */
:root {
  color-scheme: light dark;

  --grund:    #F6F8FB;
  --flaeche:  #FFFFFF;
  --flaeche2: #EDF1F7;
  --flaeche3: #E3E9F2;
  --linie:    #DEE4EC;
  --linie2:   #C3CCD9;
  --text:     #17212E;
  --text2:    #5A6879;
  --text3:    #8A96A6;

  --blau:      #1568E0;
  --blauHell:  #E6EEFC;
  --gruen:     #0E9A4C;
  --gruenHell: #E1F5EA;
  --orange:    #C06A00;
  --orangeHell:#FDEEDC;
  --rot:       #D01030;
  --rotHell:   #FCE6EA;

  --akzent:     var(--blau);
  --akzentHell: var(--blauHell);

  /* Zehn Kreisfarben, die ersten vier sind die Farben des Symbols */
  --k0:#1874FF; --k1:#10C862; --k2:#FF9100; --k3:#F5123A; --k4:#8B5CF6;
  --k5:#06B6D4; --k6:#E8B923; --k7:#EC4899; --k8:#64748B; --k9:#84CC16;

  --schatten:  0 1px 2px rgba(23,33,46,.07);
  --schatten2: 0 12px 38px rgba(23,33,46,.20);
  --rund: 14px; --rund2: 20px;
  --unten: env(safe-area-inset-bottom, 0px);
  --stunde: 54px;                 /* Höhe einer Stunde im Plan */
}

@media (prefers-color-scheme: dark) {
  :root {
    --grund:    #0D131C;
    --flaeche:  #16202D;
    --flaeche2: #1E2A3A;
    --flaeche3: #263447;
    --linie:    #263343;
    --linie2:   #3A4A5F;
    --text:     #E9EEF6;
    --text2:    #98A6B8;
    --text3:    #6A7789;

    --blau:      #5FA8FF;
    --blauHell:  #11253D;
    --gruen:     #3FD07E;
    --gruenHell: #0C2B1C;
    --orange:    #FFA83D;
    --orangeHell:#2E2011;
    --rot:       #FF6076;
    --rotHell:   #331620;

    --k0:#4D96FF; --k1:#3FD07E; --k2:#FFA83D; --k3:#FF6076; --k4:#A78BFA;
    --k5:#38D3E8; --k6:#F2CC4B; --k7:#F472B6; --k8:#94A3B8; --k9:#A3E635;

    --schatten:  0 1px 2px rgba(0,0,0,.55);
    --schatten2: 0 12px 38px rgba(0,0,0,.7);
  }
}

/* ===================================================================
   GRUNDLAGEN
   Alles benutzt logische Richtungen (inline-start statt left),
   damit Arabisch von rechts nach links ohne Sonderregeln läuft.
   =================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.45;
  background: var(--grund); color: var(--text);
  overscroll-behavior-y: none;
}
[dir="rtl"] body { font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif; }

/* Arabische Schrift traegt bei gleicher Pixelzahl dicker auf als lateinische.
   Deshalb hier durchgehend eine Stufe kleiner, sonst wirkt alles gedraengt. */
[dir="rtl"] body            { font-size: 15px; }
[dir="rtl"] .karte h1       { font-size: 27px; }
[dir="rtl"] .karte p        { font-size: 13px; }
[dir="rtl"] dialog h2       { font-size: 18px; }
[dir="rtl"] dialog .dlgUnter{ font-size: 12.5px; }
[dir="rtl"] header .marke b { font-size: 17.5px; }
[dir="rtl"] .zeitleiste b   { font-size: 17.5px; }
[dir="rtl"] .zeitleiste .unter { font-size: 12.5px; }
[dir="rtl"] nav.ansichten button { font-size: 12.5px; }
[dir="rtl"] .filter button  { font-size: 12px; }
[dir="rtl"] .knopf          { font-size: 13.5px; }
[dir="rtl"] .menuePunkt     { font-size: 13.5px; }
[dir="rtl"] .wahl button    { font-size: 13px; }
[dir="rtl"] .person         { font-size: 12.5px; }
[dir="rtl"] label           { font-size: 12.5px; }
[dir="rtl"] .hinweis        { font-size: 11.5px; }
[dir="rtl"] .eintrag .titel { font-size: 14px; }
[dir="rtl"] .eintrag .unterzeile { font-size: 12.5px; }
[dir="rtl"] .balken b       { font-size: 11.5px; }
[dir="rtl"] .balken small   { font-size: 10.5px; }
[dir="rtl"] .planName       { font-size: 12px; }
[dir="rtl"] .chip           { font-size: 12.5px; }
[dir="rtl"] .kachel b       { font-size: 20px; }
[dir="rtl"] .mitglied       { font-size: 13px; }
[dir="rtl"] .post .text     { font-size: 13px; }

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.versteckt { display: none !important; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }

/* Zahlen und Zeiten immer von links nach rechts, auch im Arabischen */
.ltr { direction: ltr; unicode-bidi: isolate; }

/* ---------- Anmeldung ---------- */
.mitte {
  min-height: 100dvh; display: flex;
  align-items: center; justify-content: center; padding: 16px;
}
.karte {
  background: var(--flaeche); border: 1px solid var(--linie);
  border-radius: var(--rund2); box-shadow: var(--schatten);
  padding: 42px 28px; width: 100%; max-width: 390px; text-align: center;
}
.karte h1 { margin: 20px 0 2px; font-size: 32px; font-weight: 700; letter-spacing: -.8px; }
.karte p { margin: 6px 0 26px; color: var(--text2); font-size: 14px; }
.sprachwahl { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.sprachwahl button {
  padding: 7px 14px; border-radius: 99px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--linie); background: none; color: var(--text2);
}
.sprachwahl button.an { background: var(--akzent); border-color: var(--akzent); color: #fff; }

.knopf {
  width: 100%; padding: 10px 16px; border: 0; border-radius: 11px;
  background: var(--akzent); color: #fff; font-size: 14px; font-weight: 600;
}
.knopf.hell { background: var(--flaeche2); color: var(--text); }
.knopf.rand { background: none; color: var(--text2); border: 1px solid var(--linie2); }
.knopf:active { transform: translateY(1px); }
.knopf:disabled { opacity: .45; }

/* ---------- Kopfzeile ---------- */
header {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--grund) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--linie);
  padding: 10px 14px; display: flex; align-items: center; gap: 8px;
}
header .marke {
  display: flex; align-items: center; gap: 9px; flex-grow: 1; min-width: 0;
  background: none; border: 0; padding: 4px 6px 4px 0; border-radius: 12px;
  color: inherit; text-align: start;
}
header .marke b { font-size: 19px; letter-spacing: -.4px; }
header .marke:active { background: var(--flaeche2); }
header .marke.dreht svg { animation: dreh .9s linear infinite; }
@keyframes dreh { to { transform: rotate(360deg); } }

.rundknopf {
  width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; padding: 0;
  border: 1px solid var(--linie); background: var(--flaeche); color: var(--text2);
  display: flex; align-items: center; justify-content: center;
}
/* Der Orbits-Knopf ist der wichtigste oben, deshalb bekommt er Farbe */
.rundknopf.bunt { background: var(--akzentHell); border-color: var(--akzent); }
.rundknopf img { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; }
.rundknopf[data-kuerzel]:not([data-kuerzel=""])::after {
  content: attr(data-kuerzel); font-size: 15px; font-weight: 700; color: var(--text2);
}
.zaehler {
  position: absolute; top: -5px; inset-inline-end: -5px;
  min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px;
  background: var(--rot); color: #fff; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--grund);
}

/* ---------- Ansichten und Filter ---------- */
nav.ansichten {
  display: flex; gap: 4px; padding: 10px 14px 0;
  overflow-x: auto; scrollbar-width: none;
  max-width: 1100px; margin: 0 auto;
}
nav.ansichten::-webkit-scrollbar { display: none; }
nav.ansichten button {
  flex: 1 0 auto; padding: 6px 10px; border: 0; border-radius: 99px;
  background: none; color: var(--text2);
  font-size: 13.5px; font-weight: 600; white-space: nowrap;
}
@media (min-width: 420px) { nav.ansichten button { padding: 8px 16px; } }
nav.ansichten button.an { background: var(--flaeche2); color: var(--text); }

.filter { display: flex; gap: 6px; padding: 8px 14px 0; max-width: 1100px; margin: 0 auto; }
.filter button {
  flex: 1; padding: 6px 9px; border: 1px solid var(--linie); border-radius: 9px;
  background: var(--flaeche); color: var(--text2); font-size: 12.5px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.filter button.an { background: var(--akzentHell); border-color: var(--akzent); color: var(--akzent); }

/* ---------- Zeitleiste ---------- */
.zeitleiste {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px 8px; max-width: 1100px; margin: 0 auto;
}
.zeitleiste .mitteBlock { flex-grow: 1; min-width: 0; }
.zeitleiste b { display: block; font-size: 19px; letter-spacing: -.3px; }
.zeitleiste .unter {
  font-size: 13px; color: var(--text2);
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.pfeil {
  width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; padding: 0;
  border: 1px solid var(--linie); background: var(--flaeche); color: var(--text2);
  font-size: 18px; line-height: 1;
}
.tagMarke {
  display: inline-block; padding: 2px 8px; border-radius: 99px;
  font-size: 11px; font-weight: 700; background: var(--flaeche2); color: var(--text2);
}
.tagMarke.frei { background: var(--gruenHell); color: var(--gruen); }

/* ---------- Suche ---------- */
.suchleiste { padding: 10px 14px 0; display: flex; gap: 8px; max-width: 1100px; margin: 0 auto; }
.suchleiste input {
  flex-grow: 1; padding: 11px 14px;
  border: 1px solid var(--linie); border-radius: 12px; background: var(--flaeche);
}

main {
  padding: 8px 14px calc(120px + var(--unten));
  display: flex; flex-direction: column; gap: 8px;
  max-width: 1100px; margin: 0 auto;
}
.leer { color: var(--text2); font-size: 14px; text-align: center; padding: 48px 20px; }
.leer .gross { font-size: 34px; margin-bottom: 10px; opacity: .45; }

.trenner {
  font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
  color: var(--text3); margin: 16px 0 2px;
  display: flex; align-items: center; gap: 8px;
}
.trenner.warn { color: var(--rot); }
.trenner::after { content: ""; flex-grow: 1; height: 1px; background: var(--linie); }

/* ===================================================================
   BALKENPLAN
   Tag und Woche als Kalender. Links die Stunden, daneben je eine
   Spalte pro Person (Tag) oder pro Wochentag (Woche).
   =================================================================== */
/* Der Plan ist ein eigener Rollbereich. Dadurch bleiben der Spaltenkopf
   oben und die Stundenspalte an der Seite stehen, während man im Plan
   scrollt. Ein waagerechter Rollbereich ist immer auch ein senkrechter,
   deshalb MUSS der Kopf hier drin kleben und nicht am Fenster. */
.planRolle {
  overflow: auto; scrollbar-width: thin;
  max-height: calc(100dvh - 310px);
  border: 1px solid var(--linie); border-radius: var(--rund);
  background: var(--flaeche); padding: 0 8px 8px;
  overscroll-behavior: contain;
}
.plan { min-width: 100%; width: max-content; }
.planKopf, .planKoerper { display: grid; grid-template-columns: 46px 1fr; }
/* Luft oben, sonst rutscht die erste Stundenzahl unter den Spaltenkopf */
.planKoerper { padding-top: 8px; }
.planKopf {
  position: sticky; top: 0; z-index: 12;
  background: var(--flaeche); padding: 8px 0 6px;
}
.planEcke {
  position: sticky; inset-inline-start: 0; z-index: 14; background: var(--flaeche);
}
.planNamen, .planSpalten { display: flex; gap: 6px; }
.planNamen > *, .planSpalten > * { flex: 1 0 118px; min-width: 118px; }
.planNamen.eng > *, .planSpalten.eng > * { flex: 1 1 0; min-width: 0; }

.planName {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: 10px;
  font-size: 13px; font-weight: 600; overflow: hidden;
}
.planName span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.planName.heute { border-color: var(--akzent); color: var(--akzent); }
.planName .klein2 { font-size: 11px; font-weight: 500; color: var(--text3); }

.planZeit { position: sticky; inset-inline-start: 0; z-index: 2; background: var(--flaeche); }
.planZeit div {
  height: var(--stunde); font-size: 11px; color: var(--text3);
  padding-inline-end: 6px; text-align: end; direction: ltr;
  transform: translateY(-6px);
}
.planFeld { position: relative; }
.planLinien { position: absolute; inset: 0; pointer-events: none; }
.planLinien i { position: absolute; inset-inline: 0; height: 1px; background: var(--linie); }
.planLinien i.halb { opacity: .45; }
.planJetzt { position: absolute; inset-inline: 0; height: 2px; background: var(--rot); z-index: 6; }
.planJetzt::before {
  content: ""; position: absolute; inset-inline-start: -3px; top: -3px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--rot);
}
.planSpalten { position: relative; }
.planSpalte { position: relative; border-inline-start: 1px solid var(--linie); }
.planSpalte.frei { background: var(--flaeche2); border-radius: 10px; }

.balken {
  position: absolute; border-radius: 9px; padding: 4px 7px; overflow: hidden;
  font-size: 12px; line-height: 1.25; color: #fff; border: 0;
  text-align: start; box-shadow: var(--schatten);
}
.balken b { display: block; font-weight: 700; font-size: 12.5px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.balken small { display: block; opacity: .88; font-size: 11px; direction: ltr; }
/* Kurze Balken zeigen nur den Titel, sonst steht die Schrift über dem Rand */
.balken.kurz { padding: 2px 6px; display: flex; align-items: center; }
.balken.kurz b { font-size: 11.5px; }
.balken.kurz small { display: none; }
/* Hohe Balken dürfen den Titel umbrechen statt ihn abzuschneiden */
.balken.hoch b { white-space: normal; }
.balken.fremd { opacity: .92; }
.balken.belegt {
  background: repeating-linear-gradient(135deg,
    var(--flaeche3), var(--flaeche3) 6px, var(--flaeche2) 6px, var(--flaeche2) 12px);
  color: var(--text2); border: 1px solid var(--linie2);
}
.balken.erledigt { opacity: .55; }
.balken.erledigt b { text-decoration: line-through; }
.balken.slot {
  background: none; border: 1.5px dashed var(--linie2); color: var(--text3);
  display: flex; align-items: center; justify-content: center; font-weight: 600;
}
.balken.slot:hover, .balken.slot:active { border-color: var(--gruen); color: var(--gruen); }
.balken.slot.voll { border-style: solid; opacity: .5; }
.balken.pause {
  background: repeating-linear-gradient(135deg,
    var(--flaeche2), var(--flaeche2) 5px, transparent 5px, transparent 10px);
  color: var(--text3); border: 1px dashed var(--linie2);
  display: flex; align-items: center; justify-content: center; font-size: 11px;
}
.balken.pause b { font-weight: 600; }

.ohneZeit { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.chip {
  display: flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 99px;
  background: var(--flaeche); border: 1px solid var(--linie); font-size: 13px;
  color: var(--text); max-width: 100%;
}
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip small { color: var(--text3); font-size: 11.5px; white-space: nowrap; }
.chip.erledigt small { text-decoration: none; }
.chip.erledigt { color: var(--text3); text-decoration: line-through; }

/* ===================================================================
   SCHREIBTISCH
   Am Handy bleibt alles eine Spalte. Ab 1024 Pixeln kommt links eine
   Leiste dazu, und der Plan bekommt die ganze Breite. Eine Web-App
   darf auf einem großen Bildschirm nicht wie ein Handy aussehen.
   =================================================================== */
.rahmen { max-width: 1100px; margin: 0 auto; }
.seite { display: none; }

@media (min-width: 1024px) {
  .rahmen {
    display: grid; grid-template-columns: 252px minmax(0, 1fr);
    gap: 20px; padding: 14px 20px 0; max-width: 1560px; align-items: start;
  }
  .seite { display: block; position: sticky; top: 70px; }
  .haupt { min-width: 0; }
  nav.ansichten, .filter, .zeitleiste, .suchleiste, main { max-width: none; padding-inline: 0; }
  nav.ansichten button { flex: 0 0 auto; padding: 7px 18px; }
  .filter { max-width: 560px; }
  main { padding-bottom: 40px; }
  .planRolle { max-height: calc(100dvh - 250px); }
  .kreisWahl { display: none; }        /* steht links in der Leiste */
  .plus { inset-inline-end: 28px; bottom: 28px; }
  dialog { max-width: 620px; }
}
@media (min-width: 1440px) {
  .rahmen { grid-template-columns: 272px minmax(0, 1fr); }
}

.seiteBlock {
  background: var(--flaeche); border: 1px solid var(--linie);
  border-radius: var(--rund); padding: 12px; margin-bottom: 12px;
}
.seiteBlock label { margin-top: 0; }
.miniKopf { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.miniKopf b { flex-grow: 1; text-align: center; font-size: 14px; }
.pfeil.klein2 { width: 26px; height: 26px; font-size: 15px; border-radius: 8px; }
.miniGitter { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.miniGitter .wt { font-size: 10px; color: var(--text3); text-align: center; font-weight: 700; }
.miniTag {
  aspect-ratio: 1/1; border: 0; background: none; border-radius: 7px; padding: 0;
  font-size: 12px; color: var(--text); position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.miniTag.fremd { color: var(--text3); opacity: .45; }
.miniTag.heute { background: var(--akzentHell); color: var(--akzent); font-weight: 700; }
.miniTag.gewaehlt { outline: 2px solid var(--akzent); }
.miniTag.feier { background: var(--gruenHell); }
.miniTag.ferien { box-shadow: inset 0 -2px 0 var(--k4); }
.miniTag .pp { display: flex; gap: 1px; height: 3px; margin-top: 1px; }
.miniTag .pp i { width: 3px; height: 3px; border-radius: 50%; background: var(--akzent); }

.seiteOrbits { display: flex; flex-direction: column; gap: 5px; }
.seiteOrbits button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: start;
  padding: 7px 10px; border-radius: 9px; border: 1px solid transparent;
  background: none; color: var(--text); font-size: 13px; font-weight: 600;
}
.seiteOrbits button.an { background: var(--akzentHell); border-color: var(--akzent); color: var(--akzent); }
.seiteOffenZeile {
  display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px;
  border-top: 1px solid var(--linie);
}
.seiteOffenZeile:first-child { border-top: 0; }
.seiteOffenZeile span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seiteOffenZeile small { margin-inline-start: auto; color: var(--rot); font-size: 11px; white-space: nowrap; }
.legende { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text2); }
.legende span { display: flex; align-items: center; gap: 7px; }
.legende i { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ---------- Liste und Aufgaben behalten die Zeilen ---------- */
.eintrag {
  background: var(--flaeche); border: 1px solid var(--linie);
  border-inline-start: 3px solid var(--linie2);
  border-radius: var(--rund); box-shadow: var(--schatten);
  padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start;
}
.eintrag.faellig { border-inline-start-color: var(--rot); }
.eintrag .zeit {
  font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text2);
  min-width: 44px; padding-top: 1px; display: flex; flex-direction: column; direction: ltr;
}
.eintrag .zeit small { font-size: 11px; color: var(--text3); }
.eintrag .inhalt { flex-grow: 1; min-width: 0; }
.eintrag .titel {
  font-weight: 600; font-size: 15px;
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.eintrag .unterzeile { font-size: 13px; color: var(--text2); margin-top: 2px; overflow-wrap: anywhere; }
.eintrag.erledigt .titel { text-decoration: line-through; color: var(--text3); }

.serieRing { font-size: 13px; color: var(--text3); font-weight: 400; }
.kreisPunkt { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

.marke {
  display: inline-block; margin-top: 7px; padding: 3px 9px; border-radius: 99px;
  font-size: 12px; font-weight: 600; background: var(--flaeche2); color: var(--text2);
}
.marke.bald { background: var(--orangeHell); color: var(--orange); }
.marke.jetzt, .marke.spaet { background: var(--rotHell); color: var(--rot); }
.marke.gut { background: var(--gruenHell); color: var(--gruen); }

.haken {
  width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; padding: 0;
  border: 2px solid var(--linie2); background: var(--flaeche);
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px;
}
.haken.an { background: var(--gruen); border-color: var(--gruen); }
.weg { background: none; border: 0; color: var(--text3); font-size: 19px; padding: 0 3px; line-height: 1; }

.zusage { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
.zusage button {
  padding: 5px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--linie2); background: none; color: var(--text2);
}
.zusage button.ja.an { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.zusage button.nein.an { background: var(--rot); border-color: var(--rot); color: #fff; }

/* ---------- Monat ---------- */
.monat { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--rund); padding: 10px; }
.monatKopf, .monatGitter { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.monatKopf div { text-align: center; font-size: 11px; font-weight: 700; color: var(--text3); padding-bottom: 6px; }
.monatZelle {
  aspect-ratio: 1/1.08; border: 0; border-radius: 10px; background: none; padding: 4px 3px 3px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 13px; color: var(--text); overflow: hidden;
}
.monatZelle.fremd { color: var(--text3); opacity: .5; }
.monatZelle.heute { background: var(--akzentHell); color: var(--akzent); font-weight: 700; }
.monatZelle.gewaehlt { outline: 2px solid var(--akzent); }
.monatZelle.feier { background: var(--flaeche2); }
.monatZelle .streifen { width: 100%; display: flex; flex-direction: column; gap: 2px; }
.monatZelle .streifen i { display: block; height: 4px; border-radius: 2px; background: var(--akzent); }
.monatZelle .streifen i.task { opacity: .55; }
.monatZelle .mehr { font-size: 10px; color: var(--text3); }

/* ---------- Personen und Lücken ---------- */
.personen { display: flex; flex-wrap: wrap; gap: 7px; }
.person {
  padding: 6px 11px; border-radius: 99px; border: 1px solid var(--linie2);
  background: var(--flaeche); color: var(--text2); font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 7px;
}
.person.an { background: var(--gruen); border-color: var(--gruen); color: #fff; }

.luecke {
  display: flex; align-items: center; gap: 12px;
  background: var(--gruenHell); border-radius: var(--rund); padding: 12px 14px;
}
/* direction allein wirkt auf einem inline-Element nicht: ohne unicode-bidi
   bleibt "06:00 – 11:00" im Arabischen verdreht. Deshalb isolate. */
.luecke b { font-variant-numeric: tabular-nums; color: var(--gruen);
            direction: ltr; unicode-bidi: isolate; }
.luecke .dauer { font-size: 13px; color: var(--text2); flex-grow: 1; }

/* ---------- Kreise ---------- */
.kreisKarte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--rund); padding: 14px; }
.kreisKarte .kopf { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; flex-wrap: wrap; }
.kreisKarte .kopf b { font-size: 16px; flex-grow: 1; }
.mitglied {
  display: flex; align-items: center; gap: 9px; padding: 7px 0;
  font-size: 14px; border-top: 1px solid var(--linie); flex-wrap: wrap;
}
.mitglied .mail { color: var(--text3); font-size: 12px; overflow-wrap: anywhere; }
.mitglied .rolle {
  font-size: 11px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: .5px;
}
.avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--flaeche2);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--text2); overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.einladung {
  display: flex; align-items: center; gap: 9px; padding: 7px 0;
  font-size: 14px; border-top: 1px dashed var(--linie2); color: var(--text2); flex-wrap: wrap;
}
.einladung .warte { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--orange); }
.klein {
  padding: 4px 9px; font-size: 11.5px; border-radius: 8px;
  border: 1px solid var(--linie2); background: none; color: var(--text2);
}
.klein.gefahr { color: var(--rot); border-color: var(--rot); }
.klein.gut { color: var(--gruen); border-color: var(--gruen); }
.farbwahl { display: flex; gap: 7px; flex-wrap: wrap; }
.farbe { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.farbe.an { border-color: var(--text); }

/* ---------- Dashboard ---------- */
.kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px,1fr)); gap: 8px; }
.kachel { background: var(--flaeche2); border-radius: 12px; padding: 12px 10px; text-align: center; }
.kachel b { display: block; font-size: 22px; letter-spacing: -.5px; direction: ltr; }
.kachel span { font-size: 12px; color: var(--text2); }
.kachel.warn b { color: var(--rot); }

/* ---------- Nachrichten ---------- */
.post {
  background: var(--flaeche); border: 1px solid var(--linie);
  border-inline-start: 3px solid var(--linie2); border-radius: var(--rund); padding: 12px 14px;
}
.post.neu { border-inline-start-color: var(--akzent); background: var(--akzentHell); }
.post .von { font-size: 13px; font-weight: 700; }
.post .wann { font-size: 12px; color: var(--text3); }
.post .text { margin-top: 5px; font-size: 14px; overflow-wrap: anywhere; }
.post .knoepfe { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.post .knoepfe button {
  padding: 5px 11px; font-size: 12.5px; border-radius: 9px;
  border: 1px solid var(--linie2); background: none; color: var(--text2);
}

/* ---------- Formular ---------- */
.plus {
  position: fixed; z-index: 45; inset-inline-end: 16px; bottom: calc(16px + var(--unten));
  width: 50px; height: 50px; border-radius: 50%; border: 0;
  background: var(--akzent); color: #fff; font-size: 26px; line-height: 1;
  box-shadow: var(--schatten2);
}
/* Kurze Rückmeldung unten. Verschwindet von selbst. */
.melder {
  position: fixed; z-index: 60; inset-inline-start: 16px;
  bottom: calc(18px + var(--unten)); max-width: min(420px, calc(100% - 90px));
  background: var(--text); color: var(--flaeche); border-radius: var(--rund);
  padding: 11px 15px; font-size: 13.5px; font-weight: 600;
  box-shadow: var(--schatten2);
}
/* Die eigene Zeit von außerhalb liegt hinter dem Gruppenplan:
   sichtbar genug zum Merken, leise genug zum Übersehen. */
.balken.belegt.blass { opacity: .42; }
.balken.slot, .balken:not(.hinten) { z-index: 1; }
.balken.hinten { z-index: 0; }
/* Schlanke Fassung für reine Buchende: kein Filter, keine offenen
   Aufgaben, keine Reiterleiste. Nur die Gruppe und ihre freien Zeiten. */
body.schlank #filter,
body.schlank #seiteOffenBlock { display: none; }
body.schlank nav.ansichten { display: flex; }
dialog {
  border: 0; padding: 0; background: var(--flaeche); color: var(--text);
  width: 100%; max-width: 540px; max-height: 92dvh;
  border-radius: var(--rund2) var(--rund2) 0 0; margin: auto auto 0;
  box-shadow: var(--schatten2);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
@media (min-width: 560px) { dialog { border-radius: var(--rund2); margin: auto; } }
.dlgInhalt { padding: 20px 18px calc(20px + var(--unten)); overflow-y: auto; max-height: 92dvh; }
dialog h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.3px; }
dialog .dlgUnter { margin: 0 0 18px; font-size: 13px; color: var(--text2); }

label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin: 14px 0 6px; }
input[type=text], input[type=date], input[type=time],
input[type=email], input[type=search], input[type=number], textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--linie);
  border-radius: 11px; background: var(--grund); color: var(--text);
}
textarea { resize: vertical; min-height: 62px; }
.reihe { display: flex; gap: 10px; }
.reihe > div { flex: 1; min-width: 0; }

.wahl { display: flex; gap: 7px; }
.wahl button {
  flex: 1; padding: 9px 8px; border: 1px solid var(--linie); border-radius: 11px;
  background: var(--grund); color: var(--text2); font-size: 13.5px; font-weight: 600;
}
.wahl button.an { background: var(--akzent); border-color: var(--akzent); color: #fff; }
.wahl.klein { margin-top: 12px; }

.tageWahl { display: flex; gap: 5px; }
.tagKnopf {
  flex: 1; padding: 8px 0; border: 1px solid var(--linie); border-radius: 9px;
  background: var(--grund); color: var(--text2); font-size: 12.5px; font-weight: 600;
}
.tagKnopf.an { background: var(--gruen); border-color: var(--gruen); color: #fff; }

.schalter {
  display: flex; align-items: center; gap: 11px; margin: 12px 0 0;
  font-size: 14px; font-weight: 400; color: var(--text); cursor: pointer;
}
.schalter input { width: 21px; height: 21px; flex-shrink: 0; margin: 0; accent-color: var(--gruen); }

.hinweis { font-size: 12px; color: var(--text3); margin-top: 8px; line-height: 1.5; }
.fehler { color: var(--rot); font-size: 13px; margin-top: 12px; }
.gutText { color: var(--gruen); font-size: 14px; font-weight: 600; margin-top: 12px; }
.aktionen { display: flex; gap: 9px; margin-top: 22px; flex-wrap: wrap; }
.aktionen .knopf { flex: 1; min-width: 120px; }
.block { border-top: 1px solid var(--linie); margin-top: 18px; padding-top: 6px; }
/* Die drei Schritte beim Einrichten. Die Reihenfolge ist keine Deko:
   ohne Arbeitszeit weiss eine Terminart nicht, wovon sie den Rest nimmt. */
.schrittNr { font-size: 11px; font-weight: 800; letter-spacing: .09em;
             text-transform: uppercase; color: var(--k0); margin: 8px 0 2px; }
/* Eine Meldung gehört neben den Knopf, der sie ausgelöst hat.
   Ganz unten im Dialog sieht sie am Telefon niemand. */
.blockMeldung { font-size: 13px; font-weight: 600; margin-top: 8px; color: var(--rot); }
.blockMeldung.gut { color: var(--gruen); }
.blockMeldung:empty { display: none; }
.artWarn { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 700;
           color: var(--orange); background: var(--orangeHell);
           border-radius: 99px; padding: 2px 8px; }

.zeile2 {
  display: flex; align-items: center; gap: 9px; padding: 8px 0;
  border-top: 1px solid var(--linie); font-size: 14px;
}
.zeile2 .wachs { flex-grow: 1; min-width: 0; }
.zeile2 .wachs small { display: block; font-size: 12px; color: var(--text3); direction: ltr; }

/* Menue hinter dem Profilbild */
.menueListe { display: flex; flex-direction: column; gap: 6px; }
.menuePunkt {
  width: 100%; text-align: start; padding: 11px 13px; border-radius: 11px;
  border: 1px solid var(--linie); background: var(--flaeche); color: var(--text);
  font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 9px;
}
.menuePunkt.an { background: var(--akzentHell); border-color: var(--akzent); color: var(--akzent); }
.menuePunkt .pfeilchen { margin-inline-start: auto; color: var(--text3); font-weight: 400; }

/* Kacheln der Übersicht sind anklickbar */
.kachel { border: 1px solid transparent; }
button.kachel { cursor: pointer; }
button.kachel:active { border-color: var(--akzent); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: start; font-size: 11px; font-weight: 700; letter-spacing: .5px;
     text-transform: uppercase; color: var(--text3); padding: 0 8px 8px 0; }
td { padding: 8px 8px 8px 0; border-top: 1px solid var(--linie); vertical-align: top; }
td.n { color: var(--text2); white-space: nowrap; }
</style>
</head>
